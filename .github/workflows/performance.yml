name: Compiler performance

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-latency:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        with:
          cache-name: macos-latency
      - name: Measure build, run, and first execution latency
        run: |
          uname -m
          go build -o "$RUNNER_TEMP/bork" ./cmd/bork
          go build -ldflags='-X github.com/GiGurra/bork/internal/driver.cacheTestGate=enabled' -o "$RUNNER_TEMP/bork-profile" ./cmd/bork
          python3 scripts/benchmark_macos.py --bork "$RUNNER_TEMP/bork" --probe-bork "$RUNNER_TEMP/bork-profile" | tee macos-latency.json
      - name: Verify executable reuse on macOS
        run: go test ./cmd/bork -run 'Test(BuildReceipt|BuildReceipts|RunAndScriptSkip|ScriptExec)' -count=1
      - name: Measure pure Go HTTP builds
        run: |
          CGO_ENABLED=0 python3 scripts/benchmark_macos.py --bork "$RUNNER_TEMP/bork" --probe-bork "$RUNNER_TEMP/bork-profile" | tee macos-purego-latency.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos-latency
          path: |
            macos-latency.json
            macos-purego-latency.json
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        id: go-cache
        with:
          cache-name: benchmark
      - name: Compiler phases and allocations
        shell: bash
        run: go test ./internal/driver -run '^$' -bench '^BenchmarkCompilerPhases/(hello|synthetic1000)/' -benchtime=3x -count=3 | tee phases.txt
      - name: CLI latency and sizes
        run: |
          go build -o /tmp/bork ./cmd/bork
          python3 scripts/benchmark.py --bork /tmp/bork --program hello --program synthetic1000 --samples 3 > latency.json
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-performance
          path: |
            phases.txt
            latency.json
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.cache-paths }}
          key: ${{ steps.go-cache.outputs.cache-key }}
