name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  grammar:
    name: TextMate grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode
      - run: npm test --prefix editors/vscode
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: test

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run tests
        run: go test ./... -count=1

      # The tests run the examples (with their args.txt) and check their
      # output; this checks the CLI itself on each of them.
      - name: Check the examples with the CLI
        run: |
          go install ./cmd/bork
          for d in examples/*/; do bork check "$d"; done
  race:
    name: Race (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, driver-cases, driver-examples, driver-integration-0, driver-integration-1]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        with:
          cache-name: race-${{ matrix.group }}
      - name: Run race group
        env:
          GOTOOLCHAIN: local
        run: python3 scripts/race.py '${{ matrix.group }}'
  replay:
    name: Captured-input parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        with:
          cache-name: replay
      - name: Compare clean compilation with captured-input replay
        run: go test -race ./internal/driver -run '^(TestCompilationReplayMatchesClean|TestSessionMatchesClean|TestWatch)' -count=1
  ci-ok:
    name: CI ok
    if: always()
    needs: [grammar, test, race, replay]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          print("Required CI results:", results)
          sys.exit(0 if results and all(result == "success" for result in results) else 1)
          PY
