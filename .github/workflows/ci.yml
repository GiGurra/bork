name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run tests
        run: go test ./... -count=1

      - name: Run tests with -race
        run: go test -race ./... -count=1

      # The tests run the examples (with their args.txt) and check their
      # output; this checks the CLI itself on each of them.
      - name: Check the examples with the CLI
        run: |
          go install ./cmd/bork
          for d in examples/*/; do bork check "$d"; done
