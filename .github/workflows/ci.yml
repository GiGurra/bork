name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  queue: ${{ github.ref == 'refs/heads/main' && 'max' || 'single' }}

jobs:
  grammar:
    name: TextMate grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode
      - run: npm test --prefix editors/vscode
      - run: npm run package --prefix editors/vscode
  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/tree-sitter-bork/package-lock.json
      - run: npm ci --prefix editors/tree-sitter-bork
      - run: npm run generate --prefix editors/tree-sitter-bork
      - run: git diff --exit-code -- editors/tree-sitter-bork/src
      - run: npm test --prefix editors/tree-sitter-bork
      - run: node scripts/check-editor-keywords.cjs
  editors:
    name: Native editor packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        with:
          cache-name: editors
      - name: Install headless editors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vim emacs-nox
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/nvim-treesitter"
          curl -fsSL https://github.com/nvim-treesitter/nvim-treesitter/archive/e289100ff98969e118c702199d88b764ce9e7fdf.tar.gz | tar -xz --strip-components=1 -C "$RUNNER_TEMP/nvim-treesitter"
          curl -fsSL https://github.com/helix-editor/helix/releases/download/25.07.1/helix-25.07.1-x86_64-linux.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/helix-25.07.1-x86_64-linux" >> "$GITHUB_PATH"
      - name: Check shared query snapshots and build parser
        run: |
          python3 editors/sync-queries.py --check
          python3 editors/tests/check-upstream.py
          go build -o "$RUNNER_TEMP/bork" ./cmd/bork
          editors/install-parser.sh "$RUNNER_TEMP/site/parser/bork.so"
          mkdir -p "$RUNNER_TEMP/emacs-parser"
          cp "$RUNNER_TEMP/site/parser/bork.so" "$RUNNER_TEMP/emacs-parser/libtree-sitter-bork.so"
      - name: Vim syntax on every example and case
        run: vim -Nu NONE -n -es -S editors/tests/vim.vim
      - name: Neovim compiler attachment and query coverage
        env:
          BORK_TEST_BINARY: ${{ runner.temp }}/bork
          BORK_TEST_SITE: ${{ runner.temp }}/site
          BORK_TEST_NVIM_TREESITTER: ${{ runner.temp }}/nvim-treesitter
          NVIM_LOG_FILE: ${{ runner.temp }}/nvim.log
        run: nvim --headless -u NONE -l editors/tests/nvim.lua
      - name: Emacs font-lock, tree-sitter and Eglot attachment
        env:
          BORK_TEST_BINARY: ${{ runner.temp }}/bork
          BORK_TEST_EMACS_PARSER: ${{ runner.temp }}/emacs-parser
        run: emacs -Q --batch -L editors/emacs -l editors/tests/emacs.el
      - name: Helix grammar fetching, building and health
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/helix-config
          HELIX_RUNTIME: ${{ runner.temp }}/helix-runtime
        run: |
          mkdir -p "$XDG_CONFIG_HOME/helix" "$HELIX_RUNTIME/queries/bork"
          { echo 'use-grammars = { only = ["bork"] }'; cat editors/helix/languages.toml; } > "$XDG_CONFIG_HOME/helix/languages.toml"
          cp editors/helix/queries/bork/*.scm "$HELIX_RUNTIME/queries/bork/"
          hx --grammar fetch
          hx --grammar build
          PATH="$RUNNER_TEMP:$PATH" hx --health bork
      - name: Zed WASM extension
        run: |
          rustup target add wasm32-wasip1
          cargo fmt --manifest-path editors/zed/Cargo.toml --check
          cargo build --manifest-path editors/zed/Cargo.toml --locked --release --target wasm32-wasip1
  shards:
    name: Test shard plan
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.matrix.outputs.groups }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts -p 'test_ci.py'
      - run: python3 -m unittest discover -s scripts -p 'test_release.py'
      - id: matrix
        run: |
          groups="$(python3 scripts/ci.py matrix)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        id: go-cache
        with:
          cache-name: lint
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.cache-paths }}
          key: ${{ steps.go-cache.outputs.cache-key }}
  examples:
    name: CLI examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        id: go-cache
        with:
          cache-name: examples
      # Suite tests run examples with args.txt and check output. This checks
      # the CLI itself on every example in its own parallel job.
      - run: |
          go install ./cmd/bork
          for d in examples/*/; do bork check "$d"; bork lint "$d"; done
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.cache-paths }}
          key: ${{ steps.go-cache.outputs.cache-key }}
  suite:
    name: ${{ matrix.mode == 'race' && 'Race' || 'Test' }} (${{ matrix.shard }})
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
        shard: ${{ fromJSON(needs.shards.outputs.groups) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-suite
        with:
          mode: ${{ matrix.mode }}
          shard: ${{ matrix.shard }}
  replay:
    name: Captured-input parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        id: go-cache
        with:
          cache-name: replay
      - name: Compare clean compilation with captured-input replay
        run: go test -race ./internal/driver -run '^(TestCompilationReplayMatchesClean|TestSessionMatchesClean|TestWatch)' -count=1
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.cache-paths }}
          key: ${{ steps.go-cache.outputs.cache-key }}
  cache-maintenance:
    name: Cache maintenance (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        id: go-cache
        with:
          cache-name: cache-maintenance
      - name: Exercise portable retention and staging locks
        run: go test -race ./internal/driver -run '^(TestCacheTrim|TestCacheResultHourlyUse|TestGoStageHourlyUseSurvivesReplacement|TestCompilerArtifactNamespace|TestDarwinCompiler|TestCacheInstalledSDK|TestGoReceiptRoundtrip|TestGoNameReceiptRoundtrip)' -count=1
      - name: Exercise detached maintenance and its hard timeout
        run: go test -race ./cmd/bork -run '^(TestCacheTrimDetached|TestDiskCacheBackgroundPublication|TestAutomaticCacheCLI)$' -count=1
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.cache-paths }}
          key: ${{ steps.go-cache.outputs.cache-key }}
  ci-ok:
    name: CI ok
    if: always()
    needs: [grammar, tree-sitter, editors, shards, lint, examples, suite, replay, cache-maintenance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          print("Required CI results:", results)
          sys.exit(0 if results and all(result == "success" for result in results) else 1)
          PY
