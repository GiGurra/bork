name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  grammar:
    name: TextMate grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode
      - run: npm test --prefix editors/vscode
  shards:
    name: Test shard plan
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.matrix.outputs.groups }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts -p 'test_ci.py'
      - id: matrix
        run: |
          groups="$(python3 scripts/ci.py matrix)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        id: go-cache
        with:
          cache-name: lint
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.cache-paths }}
          key: ${{ steps.go-cache.outputs.cache-key }}
  examples:
    name: CLI examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        id: go-cache
        with:
          cache-name: examples
      # Suite tests run examples with args.txt and check output. This checks
      # the CLI itself on every example in its own parallel job.
      - run: |
          go install ./cmd/bork
          for d in examples/*/; do bork check "$d"; done
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.cache-paths }}
          key: ${{ steps.go-cache.outputs.cache-key }}
  suite:
    name: ${{ matrix.mode == 'race' && 'Race' || 'Test' }} (${{ matrix.shard }})
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race]
        shard: ${{ fromJSON(needs.shards.outputs.groups) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-suite
        with:
          mode: ${{ matrix.mode }}
          shard: ${{ matrix.shard }}
  replay:
    name: Captured-input parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        id: go-cache
        with:
          cache-name: replay
      - name: Compare clean compilation with captured-input replay
        run: go test -race ./internal/driver -run '^(TestCompilationReplayMatchesClean|TestSessionMatchesClean|TestWatch)' -count=1
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.cache-paths }}
          key: ${{ steps.go-cache.outputs.cache-key }}
  cache-maintenance:
    name: Cache maintenance (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
        id: go-cache
        with:
          cache-name: cache-maintenance
      - name: Exercise portable retention and staging locks
        run: go test -race ./internal/driver -run '^(TestCacheTrim|TestCacheResultHourlyUse|TestGoStageHourlyUseSurvivesReplacement)' -count=1
      - name: Exercise detached maintenance and its hard timeout
        run: go test -race ./cmd/bork -run '^TestCacheTrimDetached$' -count=1
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.cache-paths }}
          key: ${{ steps.go-cache.outputs.cache-key }}
  ci-ok:
    name: CI ok
    if: always()
    needs: [grammar, shards, lint, examples, suite, replay, cache-maintenance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          print("Required CI results:", results)
          sys.exit(0 if results and all(result == "success" for result in results) else 1)
          PY
