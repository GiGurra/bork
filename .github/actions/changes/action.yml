name: Classify PR changes
description: Detect docs-only PRs; pushes and manual runs always get full checks.
outputs:
  docs-only:
    description: Whether every changed path is documentation.
    value: ${{ steps.changes.outputs.docs-only }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - id: changes
      shell: bash
      env:
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 scripts/ci_changes.py
