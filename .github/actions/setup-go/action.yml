name: Set up cached Go
description: Share module and build caches across CI jobs and commits.
inputs:
  cache-name:
    description: Cache writer name, distinct for each parallel job or shard.
    required: true
  cache-family:
    description: Optional prefix shared by writers whose build cache content matches, such as race.
    required: false
    default: ''
outputs:
  cache-key:
    description: Primary cache key for a successful main run to save.
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-hit:
    description: Whether this commit's exact cache was restored.
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-paths:
    description: Go module and build cache directories.
    value: |
      ${{ steps.paths.outputs.modules }}
      ${{ steps.paths.outputs.build }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: go.mod
        check-latest: true
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "BORK_GO_CACHE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
    # Restore everywhere, but callers save only successful main runs after
    # their tests/builds, through ../save-go-cache. PR snapshots would evict
    # the warm main caches. A commit-specific key retains new builds even
    # when go.sum is unchanged. The writer name precedes the go.sum hash so a
    # job keeps its own snapshot across dependency changes; build entries are
    # content-addressed, so stale ones only miss. Fall back to the same
    # family next: other jobs' snapshots hold no race builds, so restoring
    # one leaves a race shard to compile everything.
    - uses: actions/cache/restore@v4
      id: cache
      with:
        path: |
          ${{ steps.paths.outputs.modules }}
          ${{ steps.paths.outputs.build }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-name }}-${{ hashFiles('go.sum') }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-name }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-family || inputs.cache-name }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
