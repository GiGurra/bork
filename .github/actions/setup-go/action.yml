name: Set up cached Go
description: Share module and build caches across CI jobs and commits.
inputs:
  cache-name:
    description: Cache writer name, distinct for each parallel job or shard.
    required: true
outputs:
  cache-key:
    description: Primary cache key for a successful main run to save.
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-hit:
    description: Whether this commit's exact cache was restored.
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-paths:
    description: Go module and build cache directories.
    value: |
      ${{ steps.paths.outputs.modules }}
      ${{ steps.paths.outputs.build }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: go.mod
        check-latest: true
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    # Restore everywhere, but callers save only successful main runs after
    # their tests/builds. PR snapshots would evict the warm main caches.
    # A commit-specific key retains new builds even when go.sum is unchanged.
    - uses: actions/cache/restore@v4
      id: cache
      with:
        path: |
          ${{ steps.paths.outputs.modules }}
          ${{ steps.paths.outputs.build }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ inputs.cache-name }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ inputs.cache-name }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
