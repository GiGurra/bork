name: Set up cached Go
description: Share module and build caches across CI jobs and commits.
inputs:
  cache-name:
    description: Cache writer name, distinct for each parallel job or shard.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      id: go
      with:
        go-version-file: go.mod
        check-latest: true
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    # A commit-specific key saves newly compiled packages even when go.sum
    # hasn't changed. Each shard writes independently; restores can borrow
    # another shard's content-addressed cache when its own is unavailable.
    - uses: actions/cache@v4
      with:
        path: |
          ${{ steps.paths.outputs.modules }}
          ${{ steps.paths.outputs.build }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ inputs.cache-name }}-${{ github.sha }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ inputs.cache-name }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
