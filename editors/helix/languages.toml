[language-server.bork]
command = "bork"
args = ["lsp"]

[[language]]
name = "bork"
scope = "source.bork"
file-types = ["bork"]
shebangs = ["bork"]
roots = ["bork.mod"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
language-servers = ["bork"]
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[grammar]]
name = "bork"
source = { git = "https://github.com/GiGurra/bork", rev = "e9c1cc0d096656cb824d9ee3ddfd47b04f9f76fc", subpath = "editors/tree-sitter-bork" }
