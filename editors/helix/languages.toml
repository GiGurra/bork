[language-server.bork]
command = "bork"
args = ["lsp"]

[[language]]
name = "bork"
scope = "source.bork"
file-types = ["bork"]
shebangs = ["bork"]
roots = ["bork.mod"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
language-servers = ["bork"]
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[grammar]]
name = "bork"
source = { git = "https://github.com/GiGurra/bork", rev = "5a2cdf4c96be90dec2eeb8ab899ca4a9288d036d", subpath = "editors/tree-sitter-bork" }
