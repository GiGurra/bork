[language-server.bork]
command = "bork"
args = ["lsp"]

[[language]]
name = "bork"
scope = "source.bork"
file-types = ["bork"]
shebangs = ["bork"]
roots = ["bork.mod"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
language-servers = ["bork"]
auto-format = true
indent = { tab-width = 2, unit = "  " }

[[grammar]]
name = "bork"
source = { git = "https://github.com/GiGurra/bork", rev = "4b45e6b3a5971220225258f41ab7c683b28dddc5", subpath = "editors/tree-sitter-bork" }
