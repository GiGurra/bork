site_name: bork
site_description: A pragmatic backend language of guarantees
site_url: https://gigurra.github.io/bork/
repo_url: https://github.com/GiGurra/bork
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  navigation_depth: 3
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
hooks:
  - scripts/builtin_docs.py
  - scripts/docs_site.py
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    unrecognized_links: warn
